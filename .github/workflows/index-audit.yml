name: AI_book index drift audit

on:
  schedule:
    # Every day 09:30 Asia/Shanghai (UTC+8); schedules may be delayed by GitHub.
    - cron: '30 1 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/index-audit.yml'
      - 'scripts/audit_topic_index.py'
      - 'scripts/tests/test_audit_topic_index.py'
      - 'docs/index-audit.md'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ai-book-index-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline scanner unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_audit_topic_index.py' -v
      - name: Existing knowledge base structural check
        run: python3 scripts/validate_library.py
      - name: Audit live GitHub inventory (default branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_topic_index.py --root . --repo "${{ github.repository }}" --out-dir dist/index-audit
      - name: Add audit summary
        if: always()
        shell: bash
        run: |
          if test -f dist/index-audit/report.md; then
            cat dist/index-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          elif test "${{ github.event_name }}" = "pull_request"; then
            echo 'PR validation only: live audit starts after workflow is merged to main.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'AUDIT_INCOMPLETE: no complete report was produced. Inspect the failed job; do not infer a clean audit.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload JSON and Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-book-index-audit-${{ github.run_id }}
          path: dist/index-audit/
          if-no-files-found: ignore
          retention-days: 30
